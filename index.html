<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DeskSpot Workspace Reservation</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
</head>
<body class="bg-gray-100 text-gray-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function DeskSpotApp() {
      const [user, setUser] = useState({ user_id: 1, full_name: 'Jane Doe', email: 'jane@deskspot.com' });
      const [desks, setDesks] = useState([]);
      const [selectedDesk, setSelectedDesk] = useState(null);
      const [bookings, setBookings] = useState([]);
      const [activePass, setActivePass] = useState(null);
      const [message, setMessage] = useState('');

      const startTime = "2026-08-07T09:00:00.000Z";
      const endTime = "2026-08-07T17:00:00.000Z";

      useEffect(() => {
        fetchDesks();
        fetchUserBookings();
      }, []);

      const fetchDesks = async () => {
        const res = await fetch(`/api/v1/desks?startTime=${startTime}&endTime=${endTime}`);
        const data = await res.json();
        if (data.success) setDesks(data.desks);
      };

      const fetchUserBookings = async () => {
        const res = await fetch(`/api/v1/bookings/user/${user.user_id}`);
        const data = await res.json();
        if (data.success) setBookings(data.bookings);
      };

      const handleReserve = async () => {
        if (!selectedDesk) return;
        setMessage('Processing transaction reservation lock...');
        
        const res = await fetch('/api/v1/bookings', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            userId: user.user_id,
            deskId: selectedDesk.desk_id,
            startTime,
            endTime
          })
        });

        const data = await res.json();
        if (data.success) {
          setMessage(`Reserved ${selectedDesk.desk_code} successfully!`);
          setSelectedDesk(null);
          fetchDesks();
          fetchUserBookings();
          showQrPass(data.booking.qr_token);
        } else {
          setMessage(`Error: ${data.message}`);
        }
      };

      const showQrPass = (token) => {
        setActivePass(token);
        setTimeout(() => {
          QRCode.toCanvas(document.getElementById('qrCanvas'), token, { width: 200 });
        }, 100);
      };

      const handleCheckIn = async (token) => {
        const res = await fetch('/api/v1/checkin', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ qrToken: token })
        });
        const data = await res.json();
        alert(data.message);
        setActivePass(null);
        fetchUserBookings();
      };

      return (
        <div className="max-w-6xl mx-auto p-6">
          <header className="flex justify-between items-center bg-white p-4 rounded-lg shadow mb-6">
            <h1 className="text-2xl font-bold text-blue-600">DeskSpot Workspace Portal</h1>
            <div className="text-right">
              <span className="font-semibold block">{user.full_name}</span>
              <span className="text-sm text-gray-500">{user.email}</span>
            </div>
          </header>

          {message && (
            <div className="mb-4 p-3 bg-blue-100 text-blue-800 rounded font-medium">
              {message}
            </div>
          )}

          <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
            {/* Interactive Floor Map Boundary */}
            <div className="md:col-span-2 bg-white p-6 rounded-lg shadow">
              <h2 className="text-xl font-semibold mb-4">Floor 3 Interactive Layout</h2>
              <p className="text-sm text-gray-500 mb-6">Select an available desk from the floor map below:</p>
              
              <div className="grid grid-cols-3 gap-4 bg-gray-50 p-6 rounded-lg border-2 border-dashed border-gray-300">
                {desks.map(desk => (
                  <button
                    key={desk.desk_id}
                    disabled={!desk.is_available}
                    onClick={() => setSelectedDesk(desk)}
                    className={`h-24 rounded-lg flex flex-col items-center justify-center border-2 transition ${
                      !desk.is_available 
                        ? 'bg-red-100 border-red-300 text-red-500 cursor-not-allowed'
                        : selectedDesk?.desk_id === desk.desk_id
                          ? 'bg-blue-600 border-blue-700 text-white shadow-lg scale-105'
                          : 'bg-green-100 border-green-400 text-green-800 hover:bg-green-200'
                    }`}
                  >
                    <span className="font-bold text-lg">{desk.desk_code}</span>
                    <span className="text-xs">
                      {!desk.is_available ? 'Reserved' : 'Available'}
                    </span>
                    {desk.has_monitor && <span className="text-[10px] opacity-75">🖥️ Dual Monitor</span>}
                  </button>
                ))}
              </div>

              {selectedDesk && (
                <div className="mt-6 p-4 bg-gray-50 rounded border flex justify-between items-center">
                  <div>
                    <h3 className="font-bold">Selected: {selectedDesk.desk_code}</h3>
                    <p className="text-sm text-gray-600">Time: 09:00 AM - 05:00 PM</p>
                  </div>
                  <button 
                    onClick={handleReserve}
                    className="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 font-semibold"
                  >
                    Confirm Reservation
                  </button>
                </div>
              )}
            </div>

            {/* User Bookings & QR Side Panel */}
            <div className="bg-white p-6 rounded-lg shadow">
              <h2 className="text-xl font-semibold mb-4">Your Reservations</h2>
              {bookings.length === 0 ? (
                <p className="text-gray-500 text-sm">No reservations found.</p>
              ) : (
                <div className="space-y-3">
                  {bookings.map(b => (
                    <div key={b.booking_id} className="p-3 border rounded-lg bg-gray-50">
                      <div className="flex justify-between items-center">
                        <span className="font-bold">{b.desk_code}</span>
                        <span className={`text-xs px-2 py-1 rounded ${
                          b.status === 'CHECKED_IN' ? 'bg-green-200 text-green-800' : 'bg-yellow-200 text-yellow-800'
                        }`}>
                          {b.status}
                        </span>
                      </div>
                      <button
                        onClick={() => showQrPass(b.qr_token)}
                        className="mt-2 text-xs text-blue-600 underline font-semibold block"
                      >
                        View QR Pass Token
                      </button>
                    </div>
                  ))}
                </div>
              )}
            </div>
          </div>

          {/* Modal Component: QR Pass Terminal */}
          {activePass && (
            <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4">
              <div className="bg-white p-6 rounded-xl text-center max-w-sm w-full">
                <h3 className="text-lg font-bold mb-2">Check-in QR Pass</h3>
                <p className="text-xs text-gray-500 mb-4">Scan pass at the physical desk terminal</p>
                <div className="flex justify-center mb-4">
                  <canvas id="qrCanvas"></canvas>
                </div>
                <div className="space-y-2">
                  <button
                    onClick={() => handleCheckIn(activePass)}
                    className="w-full bg-green-600 text-white py-2 rounded font-semibold hover:bg-green-700 text-sm"
                  >
                    Simulate Terminal Scan
                  </button>
                  <button
                    onClick={() => setActivePass(null)}
                    className="w-full bg-gray-200 text-gray-700 py-2 rounded text-sm hover:bg-gray-300"
                  >
                    Close
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<DeskSpotApp />);
  </script>
</body>
</html>
